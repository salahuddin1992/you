[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kian"
version = "0.1.0"
description = "كيان / Kian — a from-scratch artificial being that learns to read, write, see, draw, think, remember and grow — built on NumPy, no ML framework."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Kian project"}]
keywords = ["ai", "from-scratch", "transformer", "autodiff", "numpy", "arabic", "agi"]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
full = ["pillow>=9.0", "mss>=7.0", "pyautogui>=0.9.54", "requests>=2.28", "pyyaml>=6.0"]
dev = ["pytest>=7.0"]

[project.scripts]
kian = "kian.cli:main"

[tool.setuptools.packages.find]
include = ["kian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
